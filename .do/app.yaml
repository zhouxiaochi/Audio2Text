name: audio2text
region: lon

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: web
    github:
      repo: zhouxiaochi/Audio2Text
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATA_DIR
        value: /tmp/audio2text
        scope: RUN_TIME
        type: GENERAL
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000
        scope: RUN_TIME
        type: GENERAL
      - key: TRANSCRIPTION_MODEL
        value: openai/whisper-1
        scope: RUN_TIME
        type: GENERAL
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
        scope: RUN_TIME
        type: GENERAL
      - key: MAX_UPLOAD_BYTES
        value: "314572800"
        scope: RUN_TIME
        type: GENERAL
      - key: MAX_ACTIVE_JOBS
        value: "1"
        scope: RUN_TIME
        type: GENERAL
      - key: RETENTION_HOURS
        value: "24"
        scope: RUN_TIME
        type: GENERAL
      - key: REMOTE_BASE_URL
        value: https://openrouter.ai/api/v1
        scope: RUN_TIME
        type: GENERAL
      - key: REMOTE_API_KEY
        value: SET_IN_DIGITALOCEAN_CONSOLE
        scope: RUN_TIME
        type: SECRET
      - key: CHUNK_SECONDS
        value: "480"
        scope: RUN_TIME
        type: GENERAL
      - key: OVERLAP_SECONDS
        value: "8"
        scope: RUN_TIME
        type: GENERAL
      - key: LLM_BATCH_CHARACTERS
        value: "24000"
        scope: RUN_TIME
        type: GENERAL
      - key: REQUEST_TIMEOUT_SECONDS
        value: "180"
        scope: RUN_TIME
        type: GENERAL
      - key: REMOTE_MAX_RETRIES
        value: "4"
        scope: RUN_TIME
        type: GENERAL

