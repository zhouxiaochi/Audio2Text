[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio2text-backend"
version = "0.1.0"
description = "Persistent audio transcription and document generation backend"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pymongo>=4.10",
  "pwdlib[argon2]>=0.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "mongomock>=4.3",
  "moto[s3]>=5",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
